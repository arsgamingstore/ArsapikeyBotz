name = "ars-reseller-bot"
compatibility_date = "2026-10-01"
main = "src/index.js"

# SELL_PRICES dan binding KV BOT_KV SENGAJA ditulis di sini: pada Worker
# yang terhubung git, wrangler deploy memakai wrangler.toml sebagai sumber
# kebenaran — variable/binding yang hanya ada di dashboard KEHAPUS tiap
# deploy (terbukti 2026-10-29: SELL_PRICES dan BOT_KV hilang setelah
# deploy, bot mati). Secret tetap di dashboard (deploy tidak menyentuh
# secret). Pelajaran GatewayARS soal placeholder id tidak berlaku di sini:
# id di bawah adalah id namespace BOT_KV yang asli.
[vars]
SELL_PRICES = '{"28":7150,"31":13000,"32":31200,"33":58500,"34":110500,"35":273000}'
# Origin gateway untuk alur hybrid (buyer base URL = GATEWAY_URL + /v1).
# BOT_SERVICE_KEY adalah secret di dashboard (bukan di sini) — nilainya
# harus SAMA dengan BOT_SERVICE_KEY di Pages project gateway.
GATEWAY_URL = "https://cloud-arsgamingstore.pages.dev"

[[kv_namespaces]]
binding = "BOT_KV"
id = "3de74e7f803c4d1da8a1e1aa7eda3066"

[triggers]
crons = ["* * * * *"]
